[package]
name = "cornix-studio"
version = "0.1.0"
description = "An unofficial fast Vial-compatible configurator for Cornix LP"
authors = ["Ponkan230 and Cornix Studio contributors"]
license = "GPL-2.0-or-later"
repository = "https://github.com/Ponkan230/cornix-studio"
homepage = "https://github.com/Ponkan230/cornix-studio"
edition = "2024"

[lib]
name = "cornix_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cornix-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
hidapi = { version = "2.6", default-features = false, features = ["windows-native", "linux-native", "macos-shared-device"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
xz2 = "0.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
